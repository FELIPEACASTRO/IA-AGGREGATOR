# =============================================================================
# IA Aggregator - Application Configuration
# =============================================================================

spring:
  application:
    name: ia-aggregator

  # --- Virtual Threads (Java 21 / Project Loom) ---
  # Enables VTs for all servlet requests — equivalent I/O throughput to WebFlux
  # at 500 TPS: 500 req/s x 200ms latency = 100 VTs in flight = ~1MB heap
  threads:
    virtual:
      enabled: true

  # --- PostgreSQL ---
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ia_aggregator}?stringtype=unspecified
    username: ${DB_USERNAME:ia_aggregator}
    password: ${DB_PASSWORD:ia_aggregator}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      max-lifetime: 600000
      connection-timeout: 30000
      pool-name: IAggregatorPool

  # --- JPA ---
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: auth
        jdbc:
          time_zone: UTC
        format_sql: true

  # --- Flyway ---
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: auth,billing,chat,ai_gateway,partners,content,teams,analytics,audit
    default-schema: auth
    table: flyway_schema_history

  # --- Redis ---
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 5000ms
      lettuce:
        pool:
          min-idle: 2
          max-active: 10
          max-idle: 8

  # --- Jackson ---
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

# --- Server ---
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  error:
    include-message: always
    include-binding-errors: always

# --- Application Security ---
app:
  security:
    jwt:
      secret: ${JWT_SECRET}
      access-token-expiry: 15m
      refresh-token-expiry: 7d
    rate-limit:
      requests-per-minute: ${RATE_LIMIT_RPM:60}
      requests-per-hour: ${RATE_LIMIT_RPH:600}
    webhooks:
      github-secret: ${GITHUB_WEBHOOK_SECRET:}
      slack-signing-secret: ${SLACK_SIGNING_SECRET:}
      linear-webhook-secret: ${LINEAR_WEBHOOK_SECRET:}
      stripe-webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  sso:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
    github:
      client-id: ${GITHUB_CLIENT_ID:}
      client-secret: ${GITHUB_CLIENT_SECRET:}
  billing:
    stripe:
      secret-key: ${STRIPE_SECRET_KEY:}
      prices:
        starter: ${STRIPE_PRICE_STARTER:}
        pro: ${STRIPE_PRICE_PRO:}
        business: ${STRIPE_PRICE_BUSINESS:}
        enterprise: ${STRIPE_PRICE_ENTERPRISE:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,https://iaggregator.com.br,https://www.iaggregator.com.br}
  ai:
    guardrails:
      max-prompt-length: ${AI_MAX_PROMPT_LENGTH:5000}
      blocked-patterns: ${AI_BLOCKED_PATTERNS:(?i).*\\b(ignore\\s+previous\\s+instructions|system\\s+override|jailbreak|bypass\\s+policy)\\b.*}
      prompt-action: ${AI_PROMPT_ACTION:block}
      max-output-length: ${AI_MAX_OUTPUT_LENGTH:8000}
      output-blocked-patterns: ${AI_OUTPUT_BLOCKED_PATTERNS:(?i).*\\b(api\\s*key|private\\s*key|token)\\b.*}
      output-action: ${AI_OUTPUT_ACTION:block}
      pii-detection:
        enabled: ${AI_PII_DETECTION_ENABLED:true}
        action: ${AI_PII_ACTION:mask}
        custom-patterns: ${AI_PII_CUSTOM_PATTERNS:}
      content-filter:
        enabled: ${AI_CONTENT_FILTER_ENABLED:true}
        action: ${AI_CONTENT_FILTER_ACTION:block}
        blocked-keywords: ${AI_CONTENT_BLOCKED_KEYWORDS:}
        blocked-regex: ${AI_CONTENT_BLOCKED_REGEX:}
    routing:
      default-model: ${AI_DEFAULT_MODEL:gpt-4o-mini}
      fallback-models: ${AI_FALLBACK_MODELS:claude-3-5-haiku,gemini-1.5-flash}
      rules:
        - name: cost-optimized-chat
          priority: 10
          strategy: cost-optimized
          capabilities: [CHAT]
          allowed-models: [gpt-4o-mini, claude-3-5-haiku, gemini-1.5-flash]
          conditions:
            user-role: USER
          enabled: true
        - name: quality-first-admin
          priority: 5
          strategy: quality-optimized
          capabilities: [CHAT, RESPONSES]
          allowed-models: [gpt-4o, claude-3-5-sonnet, gemini-1.5-pro]
          conditions:
            user-role: ADMIN
          enabled: true
        - name: default-balanced
          priority: 100
          strategy: balanced-default
          enabled: true
      semantic-cache:
        enabled: ${AI_SEMANTIC_CACHE_ENABLED:true}
        ttl-seconds: ${AI_SEMANTIC_CACHE_TTL:300}
    providers:
      openai:
        api-key: ${OPENAI_API_KEY:}
        base-url: ${OPENAI_BASE_URL:https://api.openai.com}
        timeout-ms: ${OPENAI_TIMEOUT_MS:15000}
        retry-attempts: ${OPENAI_RETRY_ATTEMPTS:2}
        retry-backoff-ms: ${OPENAI_RETRY_BACKOFF_MS:250}
