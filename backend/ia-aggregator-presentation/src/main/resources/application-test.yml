# =============================================================================
# Test Profile Configuration
# =============================================================================
# Overrides for automated tests — provides fixed JWT_SECRET and disables
# external dependencies (Redis, etc.) that are not available in CI.

app:
  jwt:
    secret: dGVzdC1zZWNyZXQta2V5LWZvci1qdW5pdC10ZXN0aW5nLW9ubHk=
    expiration-ms: 3600000
  cors:
    allowed-origins: http://localhost:3000

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ia_aggregator}?stringtype=unspecified
    username: ${DB_USERNAME:ia_aggregator}
    password: ${DB_PASSWORD:ia_aggregator}
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
